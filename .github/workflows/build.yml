name: Build APK
on:
  push:
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Firma fija con los secretos del repositorio; sin ellos se usa la clave debug del runner
      - name: Prepare signing key
        if: env.SIGNING_KEY != ''
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "MIHON_GITHUB_RELEASE=true" >> "$GITHUB_ENV"
          echo "storeFile=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      # Sin telemetría (Firebase) ni actualizador de Mihon: esta app es un fork
      - name: Build app
        run: ./gradlew assembleRelease -Pinclude-telemetry=false -Penable-updater=false
        env:
          keyAlias: ${{ secrets.KEY_ALIAS }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manga-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
