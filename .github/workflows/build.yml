name: Build APK
on:
  push:
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Firma fija con los secretos del repositorio; sin ellos se usa la clave debug del runner
      - name: Prepare signing key
        if: env.SIGNING_KEY != ''
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "MIHON_GITHUB_RELEASE=true" >> "$GITHUB_ENV"
          echo "storeFile=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      # Sin telemetría (Firebase) ni actualizador de Mihon: esta app es un fork
      - name: Build app
        run: ./gradlew assembleRelease -Pinclude-telemetry=false -Penable-updater=false
        env:
          keyAlias: ${{ secrets.KEY_ALIAS }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"

      # Publica los APK en una Release para descargarlos directamente (sin ZIP)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-release\.apk$//')
            cp "$f" "dist/Mashiro-$abi.apk"
          done
          version=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          tag="v$version-r${{ github.run_number }}"
          gh release create "$tag" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "ましろ $version (build ${{ github.run_number }})" \
            --notes "Descarga **Mashiro-arm64-v8a.apk** (casi todos los móviles). Si no se instala, usa **Mashiro-universal.apk**." \
            --latest
